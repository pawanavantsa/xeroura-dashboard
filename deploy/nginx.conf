server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /var/www/xdash;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
